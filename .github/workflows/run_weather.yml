name: CODIS Weather Automation

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (台灣時間 08:00) 自動執行
  workflow_dispatch:      # 允許在 GitHub 頁面手動點擊觸發

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run Weather Script
      run: python src/main.py

    - name: Commit & Push updated data and chart
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add src/weather_database.db weather_chart.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather DB & chart [skip ci]" && git push)
