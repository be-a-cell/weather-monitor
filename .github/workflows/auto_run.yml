name: Auto Weather Monitor

on:
  schedule:
    # 修改為每 10 分鐘自動背景執行一次 (0, 10, 20, 30, 40, 50 分)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許手動點擊按鈕觸發執行

permissions:
  contents: write # 賦予機器人寫入/更新程式碼倉庫的權限

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件與字型
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib
          sudo apt-get install -y fonts-noto-cjk

      - name: 執行 Python 腳本
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python main.py

      - name: 自動將產生的資料與圖片 Commit 回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add weather_history.csv weather_chart.png
          git diff-index --quiet HEAD || git commit -m "Auto update weather data [skip ci]"
          git push
