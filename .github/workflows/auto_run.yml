name: Auto Weather Monitor

on:
  schedule:
    # 數據每小時更新，設定每小時的 0 分執行一次
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝系統中文字型
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      - name: 執行 Python 腳本
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python main.py

      - name: 自動將產生的資料與圖片 Commit 回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 將所有產生的檔案納入 Commit
          git add weather_history.csv missing_or_invalid_data.csv weather_chart.png stations_data/ NotoSansCJKtc-Regular.otf
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto update weather data & station files [skip ci]"
            git push
          else
            echo "沒有新數據變更，跳過 Commit。"
          fi
