name: Run Weather Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘自動執行一次
  workflow_dispatch:       # 支援手動觸發

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests

      - name: Run Weather Monitor Script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python src/main.py

      - name: Commit and Push Updated Data & Chart
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "Auto update weather data & station files"
            git push
          else
            echo "沒有新數據變更，跳過 Commit。"
          fi
