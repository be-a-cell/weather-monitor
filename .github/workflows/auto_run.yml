name: Run Weather Monitor

on:
  schedule:
    - cron: '0 * * * *'  # 每小時自動執行一次
  workflow_dispatch:       # 支援手動按按鈕執行

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 安裝 Ubuntu 系統內建的中文字型，確保圖表中文顯示正常
      - name: Install Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests

      - name: Run Weather Monitor Script
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python main.py

      - name: Commit and Push Updated Data & Chart
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 自動追蹤所有新增與更改的檔案，避免指定特定檔名發生致命錯誤
          git add .

          if ! git diff --staged --quiet; then
            git commit -m "Auto update weather data & station files [skip ci]"
            git push
          else
            echo "沒有新數據變更，跳過 Commit。"
          fi
