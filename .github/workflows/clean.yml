name: Clean Raw Data to Historical Data

on:
  push:
    paths:
      - 'raw/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Process Script
        run: python src/process.py

      - name: Commit cleaned historical data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add historical_data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto: process raw files to historical_data [skip ci]"
            git push
          else
            echo "無新增資料需要提交。"
          fi
