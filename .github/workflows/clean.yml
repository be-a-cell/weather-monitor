name: Clean Raw Data to Historical Data

on:
  push:
    paths:
      - 'raw/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-and-organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Traditional Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests

      - name: Run Process Script (Clean Raw)
        run: python src/process.py

      - name: Run Weather Monitor Script (Update Chart)
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python src/main.py

      - name: Commit cleaned historical data & chart
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto: process raw files and update weather chart"
            git push
          else
            echo "無新增資料變更，跳過提交。"
          fi
